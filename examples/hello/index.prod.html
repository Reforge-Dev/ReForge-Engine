<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello ReForge (built bundle)</title>
    <link rel="stylesheet" href="../../engine/dist/reforge-engine.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0d0b;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
    <script type="module">
      import { createGame } from "../../engine/dist/reforge-engine.js";
      const game = createGame(
        await (await fetch("./game.json")).json(),
        document.getElementById("game"),
        { assetBase: "./" },
      );
      game.start();
    </script>
  </body>
</html>
